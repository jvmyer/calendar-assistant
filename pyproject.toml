[project]
name = "calendar-assistant"
version = "0.1.0"
description = "Persönlicher Planungsassistent: Aufgaben aus Quellen → Blocker in Google Kalender"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "icalendar>=7.3.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
planner = "planner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
