[project]
name = "calendar-assistant"
version = "0.1.0"
description = "Self-hosted planning assistant: tasks from email, ILIAS and Telegram become time blocks in Google Calendar"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=12,<16",
    "faster-whisper>=1.1",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "mcp>=2.3.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0",
    "python-telegram-bot>=22.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
planner = "planner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
